packages:
  "framer-motion": "For page transitions and smooth UI animations"
  "react-hook-form": "For complex form state management"
  "@hookform/resolvers": "For zod schema validation in forms"
  "zod": "For strict form validation schemas"
  "date-fns": "For formatting dates nicely"
  "clsx": "For merging tailwind classes conditionally"
  "tailwind-merge": "For merging tailwind classes without conflicts"

images:
  - path: "artifacts/escritorio/public/images/logo.png"
    description: "Minimalist, premium law firm logo featuring scales of justice or a geometric pillar in deep navy blue and subtle gold accents on a transparent background"
    aspect_ratio: "1:1"
  - path: "artifacts/escritorio/public/images/hero-bg.png"
    description: "Abstract, elegant, out-of-focus background showing a bright modern law office with glass walls, soft natural lighting, and deep navy blue tones"
    aspect_ratio: "16:9"

notes:
  - Hooks are imported from @workspace/api-client-react as per the provided context.
  - Using ViaCEP API for postal code (CEP) address resolution.
  - "Pasta do cliente" uses a local file URI (file:///) which may require browser configuration/extensions to open directly depending on the OS and browser security policies.
